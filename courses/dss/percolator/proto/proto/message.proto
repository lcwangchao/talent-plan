// Protocol buffers are a flexible, efficient, automated mechanism for serializing structured data.
// You can define how you want your data to be structured.
// Details can be found in https://developers.google.com/protocol-buffers/docs/proto3.

// Once you have defined the message, the `build.rs` will generate the corresponding data structure in `OUT_DIR`.
// You can use the structure by importing the `msg` module.
// Example:
// use crate::msg::CommitRequest;

syntax = "proto3";

package message;

message TimestampRequest {}

message TimestampResponse {
  uint64 timestamp = 1;
}

enum ErrCode {
  ErrUnknown = 0;
  ErrKeyNotExists = 1;
  ErrOptimisticWriteConflict = 2;
  ErrPrewriteLockConflict = 3;
  ErrPrewriteLockLost = 4;
}

message Error {
  ErrCode code = 1;
  string message = 2;
}

message GetRequest {
  uint64 start_ts = 1;
  bytes key = 2;
}

message GetResponse {
  Error error = 1;
  uint64 start_ts = 2;
  uint64 commit_ts = 3;
  bytes value = 4;
}

message KvPair {
  bytes key = 1;
  bytes value = 2;
}

message PrewriteRequest {
  uint64 start_ts = 1;
  bytes primary_key = 2;
  repeated KvPair writes = 3;
}

message PrewriteResponse {
  Error error = 1;
}

message CommitRequest {
  bool is_primary = 1;
  uint64 start_ts = 2;
  uint64 commit_ts = 3;
  repeated bytes keys = 4;
}

message CommitResponse {
  Error error = 1;
}

message DebugRequest {

}

message DebugResponse {
  string info = 1;
}